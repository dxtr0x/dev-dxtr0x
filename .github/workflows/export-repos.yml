name: Export my repositories

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: alpine-latest
    steps:
      - name: Fetch repositories and write YAML
        env:
          GH_TOKEN: ${{ secrets.REPO_LIST_TOKEN }}
        run: |
          python -m pip install PyYAML requests
          python - <<'PY'
          import os
          import requests
          import yaml

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }

          repos = []
          page = 1
          while True:
              response = requests.get(
                  "https://api.github.com/user/repos",
                  headers=headers,
                  params={
                      "affiliation": "owner",
                      "per_page": 100,
                      "page": page,
                  },
                  timeout=30,
              )
              response.raise_for_status()
              batch = response.json()
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          result = [
              {
                  "name": repo["name"],
                  "full_name": repo["full_name"],
                  "url": repo["html_url"],
                  "private": repo["private"],
                  "description": repo["description"],
              }
              for repo in repos
          ]

          with open("repos.yml", "w") as f:
              yaml.safe_dump(result, f, sort_keys=False, allow_unicode=True)

          print(f"Exported {len(result)} repositories to repos.yml")
          PY

      - name: Upload YAML
        uses: actions/upload-artifact@v4
        with:
          name: repositories-yaml
          path: repos.yml
