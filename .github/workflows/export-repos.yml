name: Export my repositories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests PyYAML

      - name: Fetch repositories and write YAML
        env:
          GH_TOKEN: ${{ secrets.REPO_LIST_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import yaml

          token = os.environ.get("GH_TOKEN")
          if not token:
              raise RuntimeError(
                  "Missing REPO_LIST_TOKEN secret."
              )

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })

          repos = []
          page = 1

          while True:
              response = session.get(
                  "https://api.github.com/user/repos",
                  params={
                      "affiliation": "owner",
                      "per_page": 100,
                      "page": page,
                      "sort": "updated",
                      "direction": "desc",
                  },
                  timeout=30,
              )
              response.raise_for_status()

              batch = response.json()
              if not batch:
                  break

              repos.extend(batch)
              page += 1

          result = []

          for repo in repos:
              response = session.get(
                  repo["languages_url"],
                  timeout=30,
              )
              response.raise_for_status()

              language_bytes = response.json()

              result.append({
                  "name": repo["name"],
                  "full_name": repo["full_name"],
                  "url": repo["html_url"],
                  "private": repo["private"],
                  "description": repo["description"],
                  "languages": [
                      {"name": name, "bytes": count}
                      for name, count in language_bytes.items()
                  ],
              })

          with open("repos.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  result,
                  f,
                  sort_keys=False,
                  allow_unicode=True,
              )

          print(f"Exported {len(result)} repositories to repos.yml")
          PY

      - name: Upload YAML artifact
        uses: actions/upload-artifact@v4
        with:
          name: repositories-yaml
          path: repos.yml
          if-no-files-found: error
          retention-days: 30
